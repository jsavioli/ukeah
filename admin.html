<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajustes — ukeah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --fundo: #FAF8FC; --branco: #FFFFFF; --texto: #2D3142; --suave: #6E748A;
      --lilas: #F1EBFF; --lilas-f: #5B3CC4; --verde: #E7F8EE; --verde-f: #1F7A4D;
      --inp-bg: rgba(255,255,255,0.9); --borda: rgba(0,0,0,0.09);
      --sombra: 0 10px 26px rgba(95, 90, 135, 0.08);
    }
    [data-tema="escuro"] {
      --fundo: #131520; --branco: #1D2030; --texto: #F2F4FA; --suave: #9CA3BC;
      --lilas: #292247; --lilas-f: #C4B0FF; --verde: #173326; --verde-f: #7EE2AE;
      --inp-bg: #262A3E; --borda: rgba(255,255,255,0.12);
      --sombra: 0 10px 26px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Nunito', sans-serif; font-weight: 400; background: var(--fundo); color: var(--texto); line-height: 1.5; padding-bottom: 48px; transition: background 0.25s ease, color 0.25s ease; }
    .container { max-width: 680px; margin: 0 auto; padding: 20px 16px; }

    .topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 12px; }
    .btn-voltar { display: inline-flex; align-items: center; gap: 6px; background: var(--branco); color: var(--texto); text-decoration: none; padding: 10px 16px; border-radius: 16px; font-size: 0.92rem; font-weight: 600; box-shadow: var(--sombra); border: 1px solid var(--borda); }
    .topo-dir { display: flex; align-items: center; gap: 10px; }
    .topo-dir h1 { font-size: 1.3rem; font-weight: 800; }
    .status-dot { padding: 5px 11px; border-radius: 14px; font-size: 0.78rem; background: var(--lilas); color: var(--lilas-f); }
    .status-dot.ok { background: var(--verde); color: var(--verde-f); }
    .status-dot.erro { background: #FFEBE9; color: #A83232; }

    .card-config { background: var(--branco); border-radius: 26px; padding: 20px 18px; box-shadow: var(--sombra); margin-bottom: 18px; border: 2px solid var(--borda); transition: background-color 0.25s ease, border-color 0.25s ease; }
    .card-cabecalho { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .card-cabecalho h2 { font-size: 1.12rem; font-weight: 700; }

    .tema-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-tema { padding: 12px; border-radius: 16px; border: 2px solid var(--borda); background: var(--inp-bg); color: var(--texto); font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    .btn-tema.ativo { border-color: var(--lilas-f); background: var(--lilas); color: var(--lilas-f); }

    .foto-area { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .foto-preview { width: 86px; height: 86px; border-radius: 50%; background: var(--inp-bg); border: 4px solid var(--branco); box-shadow: 0 6px 16px rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; font-size: 40px; overflow: hidden; flex-shrink: 0; }
    .foto-preview img { width: 100%; height: 100%; object-fit: cover; }
    .foto-botoes { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 160px; }
    .btn-foto { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--inp-bg); color: var(--texto); border: 1px solid var(--borda); border-radius: 16px; padding: 10px 14px; font-family: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .btn-remover-foto { background: transparent; border: none; color: var(--suave); font-family: inherit; font-size: 0.82rem; text-decoration: underline; cursor: pointer; text-align: left; padding: 2px 4px; }
    .input-arquivo { display: none; }

    .campo { margin-bottom: 13px; }
    .campo label { display: block; font-size: 0.85rem; color: var(--suave); margin-bottom: 5px; padding-left: 4px; }
    .campo input { width: 100%; padding: 11px 14px; border-radius: 15px; border: 1px solid var(--borda); background: var(--inp-bg); font-family: inherit; font-size: 16px; color: var(--texto); outline: none; }

    .cores-rotulo { font-size: 0.85rem; color: var(--suave); margin-bottom: 9px; padding-left: 4px; }
    .cores-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .cor-opcao { width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--branco); box-shadow: 0 4px 10px rgba(0,0,0,0.15); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; color: #2D3142; }
    .cor-opcao.selecionada { transform: scale(1.12); outline: 3px solid var(--texto); }

    .cats-lista { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .cat-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--lilas); color: var(--lilas-f); padding: 7px 12px; border-radius: 15px; font-size: 0.9rem; max-width: 100%; }
    .cat-chip span { overflow-wrap: anywhere; }
    .cat-chip button { border: none; background: rgba(255,255,255,0.5); color: var(--lilas-f); width: 22px; height: 22px; border-radius: 50%; font-weight: 700; cursor: pointer; flex-shrink: 0; }
    .add-cat-row { display: flex; gap: 8px; width: 100%; }
    .add-cat-row input { flex: 1; min-width: 0; padding: 11px 13px; border-radius: 15px; border: 1px solid var(--borda); background: var(--inp-bg); color: var(--texto); font-family: inherit; font-size: 16px; outline: none; }
    .btn-add-cat { background: var(--lilas); color: var(--lilas-f); border: none; border-radius: 15px; padding: 0 16px; font-family: inherit; font-size: 0.94rem; font-weight: 700; cursor: pointer; flex-shrink: 0; }

    .acoes-finais { display: flex; flex-direction: column; gap: 10px; }
    .btn-salvar { width: 100%; padding: 15px; border: none; border-radius: 18px; background: linear-gradient(135deg, #7C5CE6, #9E7BF5); color: #FFF; font-family: inherit; font-size: 1.02rem; font-weight: 700; cursor: pointer; box-shadow: 0 10px 24px rgba(124,92,230,0.28); }
    .btn-salvar:disabled { opacity: 0.65; }
    .btn-reset { width: 100%; padding: 12px; border: 1px solid var(--borda); border-radius: 16px; background: var(--branco); color: var(--suave); font-family: inherit; font-size: 0.9rem; cursor: pointer; }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--texto); color: var(--fundo); padding: 11px 18px; border-radius: 16px; font-size: 0.9rem; opacity: 0; pointer-events: none; transition: all 0.25s ease; z-index: 200; text-align: center; max-width: 90%; }
    .toast.visivel { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <main class="container">
    <header class="topo">
      <a href="index.html" class="btn-voltar">← Voltar</a>
      <div class="topo-dir">
        <span class="status-dot" id="status-nuvem">☁️</span>
        <h1>⚙️ Ajustes</h1>
      </div>
    </header>

    <!-- APARÊNCIA -->
    <section class="card-config">
      <div class="card-cabecalho"><h2>🎨 Aparência</h2></div>
      <div class="tema-grid">
        <button type="button" class="btn-tema" id="btn-tema-claro" onclick="mudarTema('claro')">☀️ Modo Claro</button>
        <button type="button" class="btn-tema" id="btn-tema-escuro" onclick="mudarTema('escuro')">🌙 Modo Escuro</button>
      </div>
    </section>

    <!-- PERFIL 1 -->
    <section class="card-config" id="card-p1">
      <div class="card-cabecalho"><h2 id="titulo-p1">Ministro da Economia</h2></div>
      <div class="foto-area">
        <div class="foto-preview" id="preview-p1">🎩</div>
        <div class="foto-botoes">
          <label for="arquivo-p1" class="btn-foto">📷 Foto da galeria</label>
          <input type="file" id="arquivo-p1" class="input-arquivo" accept="image/*" onchange="carregarFoto('p1', this)">
          <button type="button" class="btn-remover-foto" onclick="removerFoto('p1')">Usar ícone (🎩)</button>
        </div>
      </div>
      <div class="campo"><label for="nome-p1">Apelido</label><input type="text" id="nome-p1" oninput="atualizarTituloCard('p1')"></div>
      <div class="campo"><label for="sub-p1">Cargo ou frase curta</label><input type="text" id="sub-p1"></div>
      <p class="cores-rotulo">Cor do tema:</p>
      <div class="cores-grid" id="cores-p1"></div>
    </section>

    <!-- PERFIL 2 -->
    <section class="card-config" id="card-p2">
      <div class="card-cabecalho"><h2 id="titulo-p2">Dona Encrenca</h2></div>
      <div class="foto-area">
        <div class="foto-preview" id="preview-p2">👑</div>
        <div class="foto-botoes">
          <label for="arquivo-p2" class="btn-foto">📷 Foto da galeria</label>
          <input type="file" id="arquivo-p2" class="input-arquivo" accept="image/*" onchange="carregarFoto('p2', this)">
          <button type="button" class="btn-remover-foto" onclick="removerFoto('p2')">Usar ícone (👑)</button>
        </div>
      </div>
      <div class="campo"><label for="nome-p2">Apelido</label><input type="text" id="nome-p2" oninput="atualizarTituloCard('p2')"></div>
      <div class="campo"><label for="sub-p2">Cargo ou frase curta</label><input type="text" id="sub-p2"></div>
      <p class="cores-rotulo">Cor do tema:</p>
      <div class="cores-grid" id="cores-p2"></div>
    </section>

    <!-- CATEGORIAS -->
    <section class="card-config">
      <div class="card-cabecalho"><h2>🏷️ Categorias</h2></div>
      <div class="cats-lista" id="lista-categorias"></div>
      <div class="add-cat-row">
        <input type="text" id="nova-categoria" placeholder="Ex: 🍕 Delivery">
        <button type="button" class="btn-add-cat" onclick="adicionarCategoria()">➕ Add</button>
      </div>
    </section>

    <div class="acoes-finais">
      <button type="button" class="btn-salvar" id="btn-salvar" onclick="salvarConfiguracoes()">💾 Salvar</button>
      <button type="button" class="btn-reset" onclick="restaurarPadrao()">🔄 Restaurar padrão</button>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbznLrLxLa2-3PUecTKSc--px_y41hxUoF44L0yP5N1gPMWnujYiWkkFsbDbv6q-9kHV2A/exec';

    const PALETA_CLARO = {
      azul:    { fundo: '#E6F2FF', borda: '#B8DCFF', texto: '#2B6CB0', bolinha: '#90C8FF' },
      rosa:    { fundo: '#FFEAF2', borda: '#FFC2D9', texto: '#B83268', bolinha: '#FFA6C9' },
      lilas:   { fundo: '#F1EBFF', borda: '#D9C9FF', texto: '#5B3CC4', bolinha: '#C5ACFF' },
      verde:   { fundo: '#E7F8EE', borda: '#B5E8CB', texto: '#1F7A4D', bolinha: '#8EE0B3' },
      amarelo: { fundo: '#FFF7DC', borda: '#F5DF98', texto: '#8A6500', bolinha: '#F9DC75' },
      pessego: { fundo: '#FFF0E5', borda: '#FFD1B3', texto: '#A84B18', bolinha: '#FFB88C' }
    };

    const PALETA_ESCURO = {
      azul:    { fundo: '#1B2A40', borda: '#2D486E', texto: '#8DC8FF', bolinha: '#90C8FF' },
      rosa:    { fundo: '#381E2C', borda: '#61314A', texto: '#FF9EC7', bolinha: '#FFA6C9' },
      lilas:   { fundo: '#282144', borda: '#443775', texto: '#C2ADFF', bolinha: '#C5ACFF' },
      verde:   { fundo: '#173326', borda: '#285942', texto: '#7CE0AC', bolinha: '#8EE0B3' },
      amarelo: { fundo: '#362D16', borda: '#5E4D22', texto: '#F7D774', bolinha: '#F9DC75' },
      pessego: { fundo: '#3B2419', borda: '#663D29', texto: '#FFB085', bolinha: '#FFB88C' }
    };

    const PADRAO = {
      temaModo: 'claro',
      p1: { nome: 'Ministro da Economia', subtitulo: 'Fiscal do orçamento', cor: 'azul', icone: '🎩', foto: '' },
      p2: { nome: 'Dona Encrenca', subtitulo: 'Aprovação presidencial', cor: 'rosa', icone: '👑', foto: '' },
      categorias: ['🛒 Mercado', '💳 Cartão', '☕ Lazer & Mimos', '🏠 Casa', '💼 Salário']
    };

    let config = {};
    const clonarPadrao = () => JSON.parse(JSON.stringify(PADRAO));

    function setStatusNuvem(texto, tipo) {
      const el = document.getElementById('status-nuvem');
      el.textContent = texto; el.className = 'status-dot' + (tipo ? ' ' + tipo : '');
    }

    function aplicarTemaModo() {
      const escuro = config.temaModo === 'escuro';
      document.documentElement.setAttribute('data-tema', escuro ? 'escuro' : 'claro');
      document.getElementById('btn-tema-claro').classList.toggle('ativo', !escuro);
      document.getElementById('btn-tema-escuro').classList.toggle('ativo', escuro);
      ['p1', 'p2'].forEach(k => aplicarCorCard(k));
    }

    function mudarTema(modo) {
      config.temaModo = modo;
      aplicarTemaModo();
    }

    function carregarLocal() {
      let salvo = null;
      try { salvo = JSON.parse(localStorage.getItem('ukeah_config')); } catch (e) {}
      const base = clonarPadrao();
      config = salvo ? {
        temaModo: salvo.temaModo || 'claro',
        p1: { ...base.p1, ...(salvo.p1 || {}) },
        p2: { ...base.p2, ...(salvo.p2 || {}) },
        categorias: Array.isArray(salvo.categorias) ? salvo.categorias : base.categorias
      } : base;
      preencherTela();
    }

    async function carregarDaPlanilha() {
      try {
        const dados = await (await fetch(API_URL)).json();
        if (dados.ok && dados.config && Object.keys(dados.config).length > 0) {
          const c = dados.config, base = clonarPadrao();
          let cats = base.categorias;
          try { if (c.categorias) cats = JSON.parse(c.categorias); } catch (e) {}
          config = {
            temaModo: c.temaModo || 'claro',
            p1: { nome: c.p1_nome || base.p1.nome, subtitulo: c.p1_subtitulo || base.p1.subtitulo, cor: c.p1_cor || base.p1.cor, icone: c.p1_icone || base.p1.icone, foto: c.p1_foto || '' },
            p2: { nome: c.p2_nome || base.p2.nome, subtitulo: c.p2_subtitulo || base.p2.subtitulo, cor: c.p2_cor || base.p2.cor, icone: c.p2_icone || base.p2.icone, foto: c.p2_foto || '' },
            categorias: Array.isArray(cats) ? cats : base.categorias
          };
          try { localStorage.setItem('ukeah_config', JSON.stringify(config)); } catch (e) {}
          preencherTela();
        }
        if (dados.ok) setStatusNuvem('☁️ ✅', 'ok');
      } catch (e) { setStatusNuvem('⚠️ Offline', 'erro'); }
    }

    function preencherTela() {
      ['p1', 'p2'].forEach(k => {
        const p = config[k];
        document.getElementById(`nome-${k}`).value = p.nome;
        document.getElementById(`sub-${k}`).value = p.subtitulo;
        document.getElementById(`titulo-${k}`).textContent = p.nome || 'Sem nome';
        atualizarPreviewFoto(k); desenharBolinhasCor(k);
      });
      aplicarTemaModo();
      desenharCategorias();
    }

    function atualizarTituloCard(k) {
      document.getElementById(`titulo-${k}`).textContent = document.getElementById(`nome-${k}`).value || 'Sem apelido';
    }

    function aplicarCorCard(k) {
      const pal = config.temaModo === 'escuro' ? PALETA_ESCURO : PALETA_CLARO;
      const tema = pal[config[k].cor] || pal.azul;
      const card = document.getElementById(`card-${k}`);
      card.style.backgroundColor = tema.fundo; card.style.borderColor = tema.borda;
      document.getElementById(`titulo-${k}`).style.color = tema.texto;
    }

    function desenharBolinhasCor(k) {
      const cont = document.getElementById(`cores-${k}`); cont.innerHTML = '';
      Object.keys(PALETA_CLARO).forEach(corKey => {
        const tema = PALETA_CLARO[corKey];
        const btn = document.createElement('button'); btn.type = 'button';
        btn.className = 'cor-opcao' + (config[k].cor === corKey ? ' selecionada' : '');
        btn.style.backgroundColor = tema.bolinha;
        btn.textContent = config[k].cor === corKey ? '✓' : '';
        btn.onclick = () => { config[k].cor = corKey; aplicarCorCard(k); desenharBolinhasCor(k); };
        cont.appendChild(btn);
      });
    }

    function atualizarPreviewFoto(k) {
      const box = document.getElementById(`preview-${k}`), p = config[k];
      if (p.foto) box.innerHTML = `<img src="${p.foto}" alt="Foto">`;
      else box.textContent = p.icone;
    }

    function carregarFoto(k, input) {
      const arq = input.files && input.files[0]; if (!arq) return;
      const leitor = new FileReader();
      leitor.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const tam = 180, canvas = document.createElement('canvas');
          canvas.width = tam; canvas.height = tam;
          const ctx = canvas.getContext('2d'), menor = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - menor)/2, (img.height - menor)/2, menor, menor, 0, 0, tam, tam);
          let dataUrl = canvas.toDataURL('image/jpeg', 0.72);
          if (dataUrl.length > 45000) dataUrl = canvas.toDataURL('image/jpeg', 0.48);
          config[k].foto = dataUrl; atualizarPreviewFoto(k);
        };
        img.src = ev.target.result;
      };
      leitor.readAsDataURL(arq);
    }

    function removerFoto(k) {
      config[k].foto = ''; document.getElementById(`arquivo-${k}`).value = '';
      atualizarPreviewFoto(k);
    }

    function desenharCategorias() {
      const cont = document.getElementById('lista-categorias'); cont.innerHTML = '';
      config.categorias.forEach((cat, i) => {
        const chip = document.createElement('div'); chip.className = 'cat-chip';
        const span = document.createElement('span'); span.textContent = cat;
        const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = '×';
        btn.onclick = () => { config.categorias.splice(i, 1); desenharCategorias(); };
        chip.append(span, btn); cont.appendChild(chip);
      });
    }

    function adicionarCategoria() {
      const inp = document.getElementById('nova-categoria'), txt = inp.value.trim();
      if (!txt) return;
      config.categorias.push(txt); inp.value = ''; desenharCategorias();
    }

    async function salvarConfiguracoes() {
      config.p1.nome = document.getElementById('nome-p1').value.trim() || PADRAO.p1.nome;
      config.p1.subtitulo = document.getElementById('sub-p1').value.trim() || PADRAO.p1.subtitulo;
      config.p2.nome = document.getElementById('nome-p2').value.trim() || PADRAO.p2.nome;
      config.p2.subtitulo = document.getElementById('sub-p2').value.trim() || PADRAO.p2.subtitulo;
      try { localStorage.setItem('ukeah_config', JSON.stringify(config)); } catch (e) {}

      const btn = document.getElementById('btn-salvar');
      btn.disabled = true; btn.textContent = '⏳ Salvando...';

      const payload = {
        temaModo: config.temaModo || 'claro',
        p1_nome: config.p1.nome, p1_subtitulo: config.p1.subtitulo, p1_cor: config.p1.cor, p1_icone: config.p1.icone, p1_foto: config.p1.foto,
        p2_nome: config.p2.nome, p2_subtitulo: config.p2.subtitulo, p2_cor: config.p2.cor, p2_icone: config.p2.icone, p2_foto: config.p2.foto,
        categorias: JSON.stringify(config.categorias)
      };

      try {
        const res = await (await fetch(API_URL, {
          method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ acao: 'salvarConfig', config: payload })
        })).json();
        if (res.ok) { setStatusNuvem('☁️ ✅', 'ok'); mostrarAviso('✅ Salvo!'); }
        else throw 0;
      } catch (e) {
        setStatusNuvem('⚠️ Erro', 'erro'); mostrarAviso('⚠️ Falhou na planilha.');
      } finally {
        btn.disabled = false; btn.textContent = '💾 Salvar';
      }
    }

    function restaurarPadrao() {
      if (!confirm('Restaurar padrão?')) return;
      config = clonarPadrao(); preencherTela(); salvarConfiguracoes();
    }

    let timerToast;
    function mostrarAviso(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('visivel');
      clearTimeout(timerToast); timerToast = setTimeout(() => t.classList.remove('visivel'), 2600);
    }

    window.addEventListener('DOMContentLoaded', () => { carregarLocal(); carregarDaPlanilha(); });
  </script>
</body>
</html>
